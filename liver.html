<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>RiskAssess | Advanced Liver Disease Prediction</title>

    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.8/css/all.css">

    <!-- Custom CSS -->
    <style>
        body {
            background-image: url('https://www.livertransplantpune.in/wp-content/uploads/2023/04/Protect-Your-Liver_-Essential-Lifestyle-Habits-for-Liver-Health.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .form-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }

        .app-navbar {
            background-color: rgba(0, 0, 0, 0.8) !important;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        #assessmentResult {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 2rem;
            margin-top: 2rem;
        }

        .risk-high { color: #dc3545; font-weight: bold; }
        .risk-moderate { color: #fd7e14; font-weight: bold; }
        .risk-low { color: #28a745; font-weight: bold; }

        .card-header { font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top app-navbar">
        <a class="navbar-brand font-weight-bold" href="#">ADVANCED LIVER DISEASE PREDICTION</a>
    </nav>

    <div class="container">
        <div class="form-container">
            <form id="loginForm" class="form-section active">
                <h1 class="h3 mb-4 text-center font-weight-normal">RiskAssess Pro</h1>
                <p class="lead text-center mb-4">Account Login</p>
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" required>
                </div>
                <div class="form-group form-check">
                    <input type="checkbox" id="rememberMe" class="form-check-input">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <button type="button" class="btn btn-primary btn-lg btn-block" onclick="handleLogin()">Login</button>
                <p class="mt-3 text-center">Don't have an account? <button type="button" class="btn btn-link p-0" onclick="showForm('signUpForm')">Sign Up</button></p>
            </form>

            <form id="signUpForm" class="form-section">
                <h1 class="h3 mb-4 text-center font-weight-normal">RiskAssess Pro</h1>
                <p class="lead text-center mb-4">Create an Account</p>
                <div class="form-group">
                    <label for="signUpUsername">Username</label>
                    <input type="text" id="signUpUsername" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="signUpPassword">Password</label>
                    <input type="password" id="signUpPassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="signUpEmail">Email</label>
                    <input type="email" id="signUpEmail" class="form-control" required>
                </div>
                <button type="button" class="btn btn-primary btn-lg btn-block" onclick="handleSignUp()">Sign Up</button>
                <p class="mt-3 text-center">Already have an account? <button type="button" class="btn btn-link p-0" onclick="showForm('loginForm')">Login</button></p>
            </form>

            <form id="predictionForm" class="form-section">
                <h1 class="h3 mb-4 text-center font-weight-normal">Liver Disease Prediction</h1>
                <p class="lead text-center mb-4">Enter Patient Details</p>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="Total_Bilirubin">Total Bilirubin</label>
                        <input type="number" step="0.1" class="form-control" id="Total_Bilirubin" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="Direct_Bilirubin">Direct Bilirubin</label>
                        <input type="number" step="0.1" class="form-control" id="Direct_Bilirubin" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="Alkaline_Phosphotase">Alkaline Phosphotase</label>
                        <input type="number" class="form-control" id="Alkaline_Phosphotase" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="Alamine_Aminotransferase">Alamine Aminotransferase</label>
                        <input type="number" class="form-control" id="Alamine_Aminotransferase" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="Total_Proteins">Total Proteins</label>
                        <input type="number" step="0.1" class="form-control" id="Total_Proteins" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="Albumin">Albumin</label>
                        <input type="number" step="0.1" class="form-control" id="Albumin" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="Albumin_and_Globulin_Ratio">Albumin and Globulin Ratio</label>
                    <input type="number" step="0.01" class="form-control" id="Albumin_and_Globulin_Ratio" required>
                </div>
                <button type="button" class="btn btn-primary btn-lg btn-block" onclick="predictLiver()">Predict Risk</button>
            </form>

            <div id="assessmentResult" class="mt-4" style="display: none;">
                <div class="text-center">
                    <h2 class="display-5">Assessment</h2>
                    <div id="predictionResult"></div>
                    <div id="parameterAnalysis" class="mt-3 text-left"></div>
                </div>
                <div class="mt-4">
                    <h4 class="text-center mb-3">Health Optimization Plan</h4>
                    <div id="optimizationContent"></div>
                </div>
                <div class="text-center mt-4">
                    <button id="downloadBtn" class="btn btn-primary btn-lg">Download Report</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
    <script>
        function showForm(formId) {
            document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
            document.getElementById(formId).classList.add('active');
        }

        function handleLogin() {
            if (document.getElementById("loginUsername").value && document.getElementById("loginPassword").value) {
                showForm('predictionForm');
            } else {
                alert("Enter login details");
            }
        }

        function handleSignUp() {
            if (document.getElementById("signUpUsername").value && document.getElementById("signUpPassword").value && document.getElementById("signUpEmail").value) {
                alert("Account created successfully! Please login.");
                showForm('loginForm');
            } else {
                alert("Please fill all fields");
            }
        }

        function predictLiver() {
            const formData = {
                Total_Bilirubin: parseFloat(document.getElementById("Total_Bilirubin").value),
                Direct_Bilirubin: parseFloat(document.getElementById("Direct_Bilirubin").value),
                Alkaline_Phosphotase: parseFloat(document.getElementById("Alkaline_Phosphotase").value),
                Alamine_Aminotransferase: parseFloat(document.getElementById("Alamine_Aminotransferase").value),
                Total_Proteins: parseFloat(document.getElementById("Total_Proteins").value),
                Albumin: parseFloat(document.getElementById("Albumin").value),
                Albumin_and_Globulin_Ratio: parseFloat(document.getElementById("Albumin_and_Globulin_Ratio").value)
            };

            fetch("http://127.0.0.1:5000/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            })
            .then(res => res.json())
            .then(data => {
                const riskClass = data.prediction === 1 ? "risk-high" : "risk-low";
                const riskLabel = data.prediction === 1 ? "HIGH RISK" : "NORMAL";
                document.getElementById("predictionResult").innerHTML = `<p class="lead ${riskClass}">Prediction: ${riskLabel}</p><p>Probability: ${data.probability}%</p>`;
                document.getElementById("parameterAnalysis").innerHTML = "<p>Based on ML prediction.</p>";

                document.getElementById("optimizationContent").innerHTML = data.prediction === 1 ?
                    `<ul><li>Adopt low-fat, high-fiber diet</li><li>Quit alcohol and smoking</li><li>Exercise 30 mins daily</li><li>Consult hepatologist</li><li>Recheck liver enzymes every 6 months</li></ul>` :
                    `<ul><li>Continue healthy diet</li><li>Avoid unnecessary meds</li><li>Annual liver function test</li><li>Maintain hydration and weight</li></ul>`;

                document.getElementById("assessmentResult").style.display = "block";
                document.getElementById("assessmentResult").scrollIntoView({ behavior: 'smooth' });
            })
            .catch(err => alert("Server error: " + err.message));
        }

        document.getElementById("downloadBtn").addEventListener("click", () => {
            html2pdf().from(document.getElementById("assessmentResult")).save("Liver_Risk_Report.pdf");
        });
    </script>
</body>
</html>
